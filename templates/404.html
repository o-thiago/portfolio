{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto text-center py-16 space-y-6">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-sky-500/10 border border-sky-500/30 text-sky-400 font-mono text-2xl font-bold">
    404
  </div>
  
  <div class="space-y-2">
    <h1 class="text-3xl font-bold text-white tracking-tight">Page Not Found</h1>
    <p class="text-slate-400 text-sm">
      The path you requested does not exist or has been relocated.
    </p>
  </div>

  <div class="pt-4 flex items-center justify-center gap-3">
    <a href="{{ config.base_url }}/" class="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-sm transition-colors">
      Return Home
    </a>
    <a href="{{ config.base_url }}/projects/" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium transition-colors">
      Browse Projects
    </a>
  </div>
</div>
{% endblock content %}
