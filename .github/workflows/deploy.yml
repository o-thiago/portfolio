name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [cv-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build site
        env:
          CV_PAT: ${{ secrets.CV_PAT || secrets.cv_pat || secrets.GH_PAT || secrets.gh_pat || secrets.PAT || secrets.pat || secrets.PERSONAL_ACCESS_TOKEN }}
          CV_REPO_URL: ${{ secrets.CV_REPO_URL || secrets.cv_repo_url || 'https://github.com/o-thiago/resume-template.git' }}
        run: nix develop --command just build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
